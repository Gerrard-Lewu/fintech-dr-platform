apiVersion: apps/v1
kind: Deployment
metadata:
  name: auditor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auditor
  template:
    metadata:
      labels:
        app: auditor
    spec:
      containers:
      - name: auditor
        image: {{ .Values.images.auditor }}
        imagePullPolicy: Never
        ports:
        - name: metrics
          containerPort: 5000
        # ----------------------------
        env:
        - name: PG_CONN
          value: "Host=postgres;Username={{ .Values.database.user }};Password={{ .Values.database.pass }};Database={{ .Values.database.ledgerName }}"
        - name: MONGO_CONN
          value: "mongodb://{{ .Values.database.user }}:{{ .Values.database.pass }}@mongodb:27017"
---
apiVersion: v1
kind: Service
metadata:
  name: auditor
  labels:
    app: auditor
spec:
  selector:
    app: auditor
  ports:
  - name: metrics
    port: 5000
    targetPort: 5000