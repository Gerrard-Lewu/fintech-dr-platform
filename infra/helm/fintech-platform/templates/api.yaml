apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: {{ .Values.images.api }}
        imagePullPolicy: Never # Tells K8s to use the local image you built
        ports:
        - containerPort: 3000
        env:
        - name: POSTGRES_URI
          value: "postgresql://{{ .Values.database.user }}:Strangerthings06@postgres:5432/{{ .Values.database.ledgerName }}"
        - name: MONGO_URI
          value: "mongodb://{{ .Values.database.user }}:Strangerthings06@mongodb:27017/admin"
        - name: SQS_ENDPOINT
          value: "http://localstack:4566"
        - name: SQS_TRANSACTION_QUEUE_URL
          value: "http://localstack:4566/000000000000/transaction-queue"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          value: "test"
        - name: AWS_SECRET_ACCESS_KEY
          value: "test"
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer # This makes the API accessible from Windows browser at localhost:3000
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: 3000