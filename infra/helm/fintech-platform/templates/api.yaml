apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: api
        image: {{ .Values.images.api }}
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /metrics
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /metrics
            port: 3000
          initialDelaySeconds:
          periodSeconds: 10
        env:
        - name: POSTGRES_URI
          value: "postgresql://{{ .Values.database.user }}:Strangerthings06@postgres:5432/{{ .Values.database.ledgerName }}"
        - name: MONGO_URI
          value: "mongodb://{{ .Values.database.user }}:Strangerthings06@mongodb:27017/admin"
        - name: SQS_ENDPOINT
          value: "https://sqs.us-east-1.amazonaws.com"
        - name: SQS_TRANSACTION_QUEUE_URL
          value: "https://sqs.us-east-1.amazonaws.com/172786533438/production-transaction-queue"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AZURE_SERVICEBUS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: azure-credentials
              key: AZURE_SERVICEBUS_CONNECTION_STRING
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
  - name: http
    port: 3000
    targetPort: 3000